[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"

[etherscan]
# Robinhood Chain (chain ID 4663) — RobinScan native Etherscan-compatible API
robinhood = { key = "${ROBINSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=4663", chain = 4663 }
# Arc Mainnet (chain ID 5042) — via Etherscan V2 unified API
arc = { key = "${ROBINSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=5042", chain = 5042 }
