name: Auto Deploy Backend to VPS

# Production API deploy. Runs only for releases: release.yml / promote-production.yml dispatch it on
# the `production` branch after promoting a release.
on:
  workflow_dispatch:

concurrency:
  group: deploy-vps-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: Deploy API & Services to VPS via SSH
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        if: env.SSH_KEY != '' && env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.2.5
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.DEPLOY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.DEPLOY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e

            echo "[Deploy] Navigating to project directory on VPS..."
            cd ${{ secrets.VPS_APP_DIR || '/var/www/proto' }}

            echo "[Deploy] Pulling latest commits from GitHub..."
            git fetch origin production
            git reset --hard origin/production

            echo "[Deploy] Rebuilding and restarting API and Redis containers via Docker Compose..."
            if docker compose version > /dev/null 2>&1; then
              docker compose up -d --build --no-deps redis api
            else
              sudo docker compose up -d --build --no-deps redis api
            fi

            echo "[Deploy] Waiting for API service readiness..."
            sleep 4

            echo "[Deploy] Running health check..."
            curl -s http://127.0.0.1:3011/health || true

            echo "[Deploy] VPS backend deployment completed successfully."

      - name: Skip VPS deployment (secrets not configured)
        if: env.SSH_KEY == '' || env.VPS_HOST == ''
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY || secrets.DEPLOY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: echo "VPS_SSH_KEY/DEPLOY or VPS_HOST secret not configured. Skipping deployment."
