name: Code Quality & Clean Code Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  clean-code:
    name: Clean Code, Strict Any & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prettier Format Check
        run: bun run format:check

      - name: Strict Zero-Any & ESLint Clean Code
        run: bun run lint

      - name: TypeScript Zero-Error Typecheck
        run: bun run typecheck
