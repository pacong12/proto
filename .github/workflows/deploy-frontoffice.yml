name: Deploy Frontoffice (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontoffice/**'
      - 'packages/shared-types/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-frontoffice.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontoffice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Build & Deploy Frontoffice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Frontoffice Production Bundle
        env:
          VITE_REOWN_PROJECT_ID: ${{ secrets.VITE_REOWN_PROJECT_ID }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.proto.family' }}
        run: bun run --filter @proto/frontoffice build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/frontoffice/dist --project-name=proto-frontoffice
        continue-on-error: true
