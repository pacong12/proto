name: Smart Contracts Guard

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-guard.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts-guard.yml'

permissions:
  contents: read

jobs:
  contract-invariants:
    name: Bytecode Size, Gas Snapshot & Invariant Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned: nightly changes gas accounting and breaks the .gas-snapshot check.
          version: v1.7.1

      - name: Setup Foundry dependencies
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std

      - name: Verify Contract Bytecode Sizes (EIP-170 24KB Limit)
        run: |
          cd contracts
          forge build --sizes --json | node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf-8"));
            let failed = false;
            for (const [name, stats] of Object.entries(data)) {
              if (stats.runtime_size > 24576) {
                console.error("FAIL: " + name + " runtime size " + stats.runtime_size + "B exceeds 24576B limit");
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log("PASS: All " + Object.keys(data).length + " contracts are within 24KB EIP-170 limit.");
          '

      - name: Run Foundry Full Unit & Invariant Tests
        run: bun run nx run contracts:test -- -vvv

      - name: Gas Snapshot Regression Check
        # Fails when any test's gas grows more than 2% over .gas-snapshot. Fuzz, invariant and
        # fork tests are excluded (their gas is not deterministic). After an intended change, run
        # `forge snapshot --no-match-test "testFuzz|invariant" --no-match-path "*fork*"` in contracts/
        # and commit .gas-snapshot.
        run: bun run nx run contracts:gas-snapshot
