name: Build & Publish API Container (GHCR)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared-types/**'
      - 'Dockerfile.api'
      - '.github/workflows/deploy-api-docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared-types/**'
      - 'Dockerfile.api'
      - '.github/workflows/deploy-api-docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-build-and-publish:
    name: Build, Smoke Test & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image (Local Test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          load: true
          tags: proto-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container Boot & Smoke Test
        run: |
          docker run -d --name test-api -p 3001:3001 proto-api:test
          for i in $(seq 1 15); do
            HEALTH=$(curl -sf http://127.0.0.1:3001/health 2>/dev/null || true)
            if echo "$HEALTH" | grep -q '"status":"ok"'; then
              echo "Health check passed on attempt $i: $HEALTH"
              docker stop test-api && docker rm test-api
              exit 0
            fi
            echo "Attempt $i: not ready yet, waiting 2s..."
            sleep 2
          done
          echo "Health check failed after 30s. Container logs:"
          docker logs test-api
          docker stop test-api && docker rm test-api
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Push Production Docker Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
