name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies with Bun
        run: bun install --frozen-lockfile

      - name: Setup Foundry dependencies
        run: |
          mkdir -p contracts/lib
          git clone --depth 1 https://github.com/foundry-rs/forge-std.git contracts/lib/forge-std

      - name: Lint Check
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit & Integration Tests (Apps)
        run: bun run test

      - name: Smart Contract Tests (Foundry)
        run: bun run test:contracts

      - name: Production Builds
        run: bun run build
