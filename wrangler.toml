name = "proto"
main = "worker.ts"
compatibility_date = "2026-09-16"

[build]
command = "VITE_REOWN_PROJECT_ID=4832fd788725bf7c34d6bc2ca2d54a85 bun run --filter @proto/frontoffice build"

[vars]
VITE_REOWN_PROJECT_ID = "4832fd788725bf7c34d6bc2ca2d54a85"
BACKEND_API_URL = "https://api.robinmood.xyz"

[assets]
directory = "apps/frontoffice/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Staging environment: CSP in Report-Only mode to catch violations safely.
# Switch CSP_REPORT_ONLY to "false" (or remove) when ready for production enforcement.
[env.staging]
name = "proto-staging"

[env.staging.vars]
CSP_REPORT_ONLY = "true"
CSP_REPORT_URI = "https://your-csp-report-endpoint.example.com/csp-report"

# Production environment: CSP enforced, no report-only.
[env.production]
name = "proto-production"

[env.production.vars]
CSP_REPORT_ONLY = "false"
VITE_REOWN_PROJECT_ID = "4832fd788725bf7c34d6bc2ca2d54a85"
BACKEND_API_URL = "https://api.robinmood.xyz"
