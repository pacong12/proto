name = "proto"
main = "worker.ts"
compatibility_date = "2026-09-16"
# Keep variables set in the dashboard (e.g. MAINTENANCE_MODE) across deploys.
keep_vars = true

[build]
command = "VITE_REOWN_PROJECT_ID=4832fd788725bf7c34d6bc2ca2d54a85 bun run --filter @goton/frontoffice build"

[vars]
VITE_REOWN_PROJECT_ID = "4832fd788725bf7c34d6bc2ca2d54a85"
BACKEND_API_URL = "https://api.goton.cloud"
DOCS_URL = "https://docs.goton.fun"

[assets]
directory = "apps/frontoffice/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Every request runs worker.ts first. Without this, browser navigations and static files were served
# straight from assets, skipping the security headers, maintenance mode and legal redirects.
run_worker_first = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true

# Environments
#   production  -> worker "proto" (top level above), goton.fun; Cloudflare builds the `production`
#                  branch, which only moves when a release is published (release.yml).
#   development -> worker "proto-dev" on https://proto-dev.mutingudin12.workers.dev (workers.dev only, no custom domain,
#                  noindex); Cloudflare builds `main` with `bunx wrangler deploy --env development`.
[env.development]
name = "proto-dev"

[env.development.build]
command = "VITE_APP_URL=https://proto-dev.mutingudin12.workers.dev VITE_DOCS_URL=https://proto-docs-dev.mutingudin12.workers.dev VITE_REOWN_PROJECT_ID=4832fd788725bf7c34d6bc2ca2d54a85 bun run --filter @goton/frontoffice build"

[env.development.vars]
VITE_REOWN_PROJECT_ID = "4832fd788725bf7c34d6bc2ca2d54a85"
BACKEND_API_URL = "https://api.goton.cloud"
# Report CSP violations instead of blocking them while developing.
CSP_REPORT_ONLY = "true"
# Keep the development site out of search results (X-Robots-Tag: noindex).
NOINDEX = "true"
DOCS_URL = "https://proto-docs-dev.mutingudin12.workers.dev"

# Production environment: CSP enforced, no report-only.
[env.production]
name = "proto-production"

[env.production.vars]
CSP_REPORT_ONLY = "false"
VITE_REOWN_PROJECT_ID = "4832fd788725bf7c34d6bc2ca2d54a85"
BACKEND_API_URL = "https://api.goton.cloud"
