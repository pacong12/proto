<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google-site-verification" content="l9eLMSYaQIM97O5MwBLUS5_vtevxk4QnDqRrequPcbQ" />

    <!-- Google Analytics loads from src/lib/analytics.ts after cookie consent. -->

    <!-- Primary Meta Tags -->
    <title>goton · Launch fixed-supply tokens on Robinhood & Arc Chain</title>
    <meta name="title" content="goton · Launch fixed-supply tokens on Robinhood & Arc Chain" />
    <meta
      name="description"
      content="goton is the non-custodial launchpad for fixed-supply tokens on Robinhood Chain and Arc Network. Deploy pure bonding curves with automatic liquidity graduation."
    />
    <meta
      name="keywords"
      content="goton,launchpad,Robinhood Chain,Arc Chain,Arc Network,token launch,fixed supply,bonding curve,uniswap,memecoin,crypto,web3,defi"
    />
    <meta name="author" content="goton" />
    <meta name="creator" content="goton" />
    <meta name="application-name" content="goton" />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />

    <!-- Typography: Poppins Font Stack -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights in use, loaded without blocking the first paint. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
      />
    </noscript>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:site_name" content="goton" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="goton · Launch fixed-supply tokens on Robinhood & Arc Chain"
    />
    <meta
      property="og:description"
      content="Deploy fixed-supply tokens with permanently locked Uniswap V3 liquidity or trading curves on Robinhood Chain and Arc Network."
    />
    <meta property="og:image" content="%VITE_APP_URL%/opengraph-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="proto: Launch fixed-supply tokens on Robinhood & Arc Chain"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@gotondotfun" />
    <meta name="twitter:creator" content="@gotondotfun" />
    <meta name="twitter:url" content="%VITE_APP_URL%" />
    <meta
      name="twitter:title"
      content="goton · Launch fixed-supply tokens on Robinhood & Arc Chain"
    />
    <meta
      name="twitter:description"
      content="Deploy fixed-supply tokens with permanently locked Uniswap V3 liquidity or trading curves on Robinhood Chain and Arc Network."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/opengraph-image.svg" />
    <meta
      name="twitter:image:alt"
      content="proto: Launch fixed-supply tokens on Robinhood & Arc Chain"
    />

    <!-- Canonical link -->
    <link rel="canonical" href="%VITE_APP_URL%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured Data (JSON-LD) for Rich Search Results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "@id": "%VITE_APP_URL%/#webapp",
            "name": "goton",
            "url": "%VITE_APP_URL%",
            "description": "Multi-chain launchpad for fixed-supply tokens on Robinhood Chain and Arc Network with locked liquidity and bonding curves.",
            "applicationCategory": "FinanceApplication",
            "operatingSystem": "All",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "Organization",
            "@id": "%VITE_APP_URL%/#organization",
            "name": "goton",
            "url": "%VITE_APP_URL%",
            "logo": "%VITE_APP_URL%/favicon.svg"
          }
        ]
      }
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
