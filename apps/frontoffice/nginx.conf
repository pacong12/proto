server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Kept in step with the Cloudflare worker's headers (worker.ts): the worker fronts production,
    # this nginx is the container fallback, and the two must not disagree. The worker's CSP is the
    # enforced one the live site runs under (no 'unsafe-eval'), so matching it here is safe.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://static.cloudflareinsights.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://fonts.reown.com data:; connect-src 'self' https: wss: https://rpc.mainnet.chain.robinhood.com https://rpc.mainnet.arc.io https://*.arc.io https://arc.drpc.org https://*.drpc.org wss://relay.walletconnect.com wss://relay.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org https://api.coingecko.com; img-src 'self' data: blob: https:; frame-src 'self' https://secure.walletconnect.org https://verify.walletconnect.org https://*.walletconnect.com https://*.reown.com; manifest-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
