services:
  redis:
    image: redis:7-alpine
    container_name: proto-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: proto-api
    environment:
      - PORT=3001
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - ROBINHOOD_RPC_URL=https://rpc.mainnet.chain.robinhood.com
      - CHAIN_ID=4663
    ports:
      - "3001:3001"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontoffice:
    build:
      context: .
      dockerfile: Dockerfile.frontoffice
      args:
        VITE_REOWN_PROJECT_ID: ${VITE_REOWN_PROJECT_ID}
    container_name: proto-frontoffice
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
    container_name: proto-docs
    ports:
      - "3002:3002"
    restart: unless-stopped
